
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Context Compression Lab</title>
</head>
<body>
<header>
  <p class="eyebrow">TEXT COMPRESSION PLAYGROUND</p>
  <h1>Context Compression Lab</h1>
  <p>
    Explore ways to make text more compact while keeping the information
    that matters.
  </p>
</header>

  <main>
    <section>
      <label for="input-text">Text to compress</label>
      <textarea
        id="input-text"
        placeholder="Paste your text here..."
        rows="10"
      ></textarea>

      
<label for="compression-method">Compression method</label>
<select id="compression-method">
  <option value="duplicate-lines">Remove duplicate lines</option>
  <option value="ai-summary">AI summary (Groq)</option>
</select>

<div id="groq-key-panel" hidden>
  <label for="groq-api-key">Your Groq API key</label>
  <input
    id="groq-api-key"
    type="password"
    placeholder="Paste your Groq API key"
    autocomplete="off"
    spellcheck="false"
  />
  <p class="key-notice">
    Your key is sent to this app's backend for AI requests.
    It should not be stored on the server.
  </p>
</div>


      <button id="compress-button">Compress text</button>
    </section>

    <section>
      <h2>Compressed result</h2>
      <p id="result-placeholder">Your compressed text will appear here.</p>
      <div id="result" aria-live="polite"></div>
      <p id="compression-stats"></p>
    </section>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
